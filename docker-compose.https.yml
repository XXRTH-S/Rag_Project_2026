services:
  api:
    environment:
      COOKIE_SECURE: 'true'
      # ปิดเอกสาร API แม้ใช้ร่วมกับ dev override
      API_DOCS_ENABLED: 'false'
      # ngrok และ Caddy ต่อท้าย X-Forwarded-For; API จึงนับจากขวาสอง hop
      TRUSTED_PROXY_HOPS: '2'
  ngrok:
    image: ngrok/ngrok:latest
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env}
    # ผ่าน Caddy เพื่อส่งต่อ IP และส่ง SSE โดยไม่ buffer
    command: ["http", "http://caddy:80", "--inspect=false", "--url=${NGROK_URL:?Set NGROK_URL to your ngrok dev domain in .env}"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
