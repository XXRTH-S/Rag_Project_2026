name: rag-workshop

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ตั้ง POSTGRES_PASSWORD ใน .env ก่อน}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # รัน bge-m3 บน CPU เพื่อเหลือ VRAM ให้ Ollama
  # ตรึง TEI 1.9.3 ด้วย digest เพื่อเลี่ยงปัญหา redirect ของรุ่นเก่า
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:cb570aabbfa016b86684f576b5bd72d1ee96cc0b7a00b0ad221b298762b32157
    # จำกัด batch และ worker เพื่อไม่ให้ TEI ใช้ RAM เกินระหว่าง warmup
    command:
      - --model-id
      - BAAI/bge-m3
      - --port
      - "8080"
      - --auto-truncate
      - --max-batch-tokens
      - "4096"
      - --max-client-batch-size
      - "16"
      - --tokenization-workers
      - "2"
    # bge-m3 เป็นโมเดลสาธารณะ; เพิ่ม HF_TOKEN เฉพาะเมื่อต้องใช้โมเดล gated
    volumes:
      - hf-cache:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      # ครั้งแรกต้องโหลด ONNX weights ของ bge-m3 ~2.2GB ซึ่งใช้เวลาเป็นสิบนาที
      # ตั้งสั้นกว่านี้จะขึ้น unhealthy ทั้งที่กำลังทำงานปกติ
      start_period: 900s
    restart: unless-stopped

  api:
    build:
      context: ./api
    env_file: [.env]
    environment:
      UPLOAD_DIR: /data/uploads
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # concurrency=1 คือข้อบังคับ ไม่ใช่การจูน — GPU 6GB รับงาน OCR ได้ทีละหน้าเท่านั้น
  worker:
    build:
      context: ./api
    env_file: [.env]
    environment:
      UPLOAD_DIR: /data/uploads
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - uploads:/data/uploads
    command:
      - celery
      - -A
      - app.worker.celery_app
      - worker
      - --loglevel=info
      - --concurrency=1
      - -Q
      - ocr_admin,ocr_user,default
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    depends_on: [api]
    ports:
      - "3000:3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  demo-retention:
    image: rag-workshop-api:latest
    profiles: [demo]
    env_file: [.env]
    environment:
      UPLOAD_DIR: /data/uploads
    command: ["python", "scripts/retention_demo.py", "--apply", "--loop"]
    volumes:
      - ./api:/app:ro
      - uploads:/data/uploads
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  hf-cache:
  uploads:
  caddy-data:
  caddy-config:
